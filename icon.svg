<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>UTMOST.FM</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1f1f"/>
      <stop offset="0.55" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#333333"/>
      <stop offset="0.45" stop-color="#999999"/>
      <stop offset="1" stop-color="#f2f2f2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#cccccc" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#cccccc" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="plate">
      <rect x="20" y="20" width="472" height="472" rx="108"/>
    </clipPath>
  </defs>

  <!-- placa redondeada con borde -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bg)"
        stroke="#b3b3b3" stroke-width="10"/>

  <g clip-path="url(#plate)">
    <!-- resplandor central -->
    <circle cx="256" cy="236" r="220" fill="url(#glow)"/>

    <!-- grid sutil -->
    <g stroke="#888888" stroke-opacity="0.07" stroke-width="2">
      <line x1="0" y1="120" x2="512" y2="120"/>
      <line x1="0" y1="168" x2="512" y2="168"/>
      <line x1="0" y1="216" x2="512" y2="216"/>
      <line x1="0" y1="264" x2="512" y2="264"/>
      <line x1="0" y1="312" x2="512" y2="312"/>
      <line x1="0" y1="360" x2="512" y2="360"/>
    </g>

    <!-- ecualizador (espectro) -->
    <g fill="url(#bar)">
      <rect x="96"  y="264" width="32" height="120" rx="12"/>
      <rect x="144" y="184" width="32" height="200" rx="12"/>
      <rect x="192" y="224" width="32" height="160" rx="12"/>
      <rect x="240" y="144" width="32" height="240" rx="12"/>
      <rect x="288" y="214" width="32" height="170" rx="12"/>
      <rect x="336" y="174" width="32" height="210" rx="12"/>
      <rect x="384" y="274" width="32" height="110" rx="12"/>
    </g>

    <!-- puntas brillantes -->
    <g fill="#ffffff">
      <rect x="96"  y="262" width="32" height="8" rx="4"/>
      <rect x="144" y="182" width="32" height="8" rx="4"/>
      <rect x="192" y="222" width="32" height="8" rx="4"/>
      <rect x="240" y="142" width="32" height="8" rx="4"/>
      <rect x="288" y="212" width="32" height="8" rx="4"/>
      <rect x="336" y="172" width="32" height="8" rx="4"/>
      <rect x="384" y="272" width="32" height="8" rx="4"/>
    </g>

    <!-- scanlines (CRT) -->
    <g fill="#000000" fill-opacity="0.24">
      <rect x="0" y="100" width="512" height="3"/>
      <rect x="0" y="130" width="512" height="3"/>
      <rect x="0" y="160" width="512" height="3"/>
      <rect x="0" y="190" width="512" height="3"/>
      <rect x="0" y="220" width="512" height="3"/>
      <rect x="0" y="250" width="512" height="3"/>
      <rect x="0" y="280" width="512" height="3"/>
      <rect x="0" y="310" width="512" height="3"/>
      <rect x="0" y="340" width="512" height="3"/>
      <rect x="0" y="370" width="512" height="3"/>
    </g>

    <!-- wordmark -->
    <text x="256" y="438" text-anchor="middle"
          font-family="Consolas, 'Courier New', monospace" font-size="52"
          font-weight="bold" letter-spacing="2" fill="#cccccc">UTMOST<tspan fill="#ffffff">.FM</tspan></text>
  </g>
</svg>
